# Tuned 2026-08-12, FPS pass 2026-08-13, 60fps lock pass 2026-08-14,
# pacing pass 2026-08-14 evening: FusionFix owns the cap (FpsLimit=59).
# A second limiter here fights that and can produce 60->30 snaps.
# dxvk.frameRate = 60

# GPL is the shader-stutter fix on DXVK 3.x; the old async keys are
# no-ops on stock (non-fork) DXVK and were previously masking the fact
# that GPL had been force-disabled. DXVK 3.0.2 now reports
# "Graphics pipeline libraries supported" in GTAIV_d3d9.log.
# 2026-08-31: exclusive-fullscreen mode-set at 2560x1440@165 lost the D3D9 device
# (black screen, must force-quit). Borderless instead. Revert: dxvk.conf.bak_blackscreen_20260831
dxvk.allowFse = false
dxvk.enableGraphicsPipelineLibrary = Auto
# dxvk.gplAsyncCache -- not a key in this build, see the note further down.

# 3 not 4: leave headroom for the game thread on an 8c/8t CPU with no SMT.
dxvk.numCompilerThreads = 3

# 2026-09-03: DXVK owns pacing now (2560x1440 @ 165 Hz, G-Sync ON).
# latencySleep delays the CPU start of each frame until the GPU is about to
# need it, so a queue depth of 1 no longer serialises CPU and GPU the way the
# 2026-08-13 test (latency 1, no latencySleep) did. Cap 60: BenchRoute 08-26
# read 52 avg / 32 1%-low, so the CPU is the ceiling and handling/physics
# degrade above ~100. With VRR the cap need not divide 165.
# FusionFix FpsLimit is 0 (falls back to the 165 Hz refresh, i.e. no-op).
# uncapped # dxvk.latencySleep = True
# uncapped # dxvk.maxFrameRate = 60
d3d9.maxFrameLatency = 2   # raster bridge: let the server overlap two frames
# VSync off. G-Sync handles everything under 165; the 60 cap never reaches it.
d3d9.presentInterval = 0

# 2026-08-13: override the DXVK built-in GTAIV profile, which reports only
# 128 MB of VRAM. With a heavy update/ texture stack (HQ Map, RDR2
# vegetation, 115 MB RestoredPeds.img) and 300 MB stream.ini pools that
# ceiling is nonsense. -availablevidmem is a *multiplier* on this number,
# so keep commandline.txt at 1.0. Card is an RTX 2070 (8 GB).
# 2026-08-29: DISABLED. DXVK's built-in GTAIV.exe profile sets
# dxgi.maxDeviceMemory = 128 precisely because GTA IV sizes its streaming and
# texture pools from reported VRAM. Overriding it to 2048 told the game it had
# 16x the video memory, so it reserved far more address space and hit the 32-bit
# wall (~3.4 GB) within minutes. Re-enable only to A/B this.
# 2026-09-06: RE-ENABLED for the raster bridge. This file is now read by the 64-bit bridge SERVER's
# DXVK only (the game-side d3d9.dll is the bridge client, not DXVK), so the address-space argument
# above no longer applies to the game process; what remained was DXVK's built-in GTAIV profile
# reporting 128 MB, which starved the texture streamer (pop-in after ~25 min at view 100).
# 2026-09-06 22:45: 2048 -> 4096. Three texture packs (HQVT 1.31, Ash misc, vehicle pack) reintroduced distant
# texture pop-in at view 100; the 128->2048 step did NOT raise client commit under the bridge (2948 -> 2883 MB
# peak), so the physical pool lives server-side now. Judge on min largest_free of the next bench.
dxgi.maxDeviceMemory = 4096

# d3d9.textureMemory -- ENABLED 2026-08-16 at 32 (DXVK default is 100).
#
# History, because this key has been wrongly closed once already:
# TRIED AND REVERTED 2026-08-15. A constant 100.0 MB private block showed up in
# both vmmap snapshots and was assumed to be this key at its default of 100. It
# is NOT: setting it to 32 was confirmed applied ("d3d9.textureMemory = 32" in
# the effective configuration in GTAIV_d3d9.log) and the 100.0 MB block was
# still present afterwards, merely relocated by ASLR to 0x000F910000. The size
# match was a coincidence, not an attribution.
#
# That result is sound about what it tested, but it does not settle the key. It
# established that one specific block is not this key -- a true negative about
# ATTRIBUTION. It says nothing about the key's EFFECT, which was never measured.
#
# In DXVK 2.x+ this key sizes the MAPPED WINDOW of the D3D9 managed-texture
# chunk allocator. When the budget is exceeded DXVK unmaps least-recently-used
# chunks. Unmapping returns ADDRESS SPACE and no memory at all -- so a change
# here is invisible in PrivateUsage, invisible in WorkingSet, and invisible in
# "did that block disappear". It shows up only in contiguity, which is the one
# thing that actually kills this 32-bit process (it dies ~3160 MB into a 4096 MB
# LAA address space, and the largest free run collapses 1762 -> 742 MB under
# load while committed rises only 774 MB).
#
# 32 is the aggressive end, and is the value already proven to apply cleanly in
# August -- the game ran fine on it, only the verdict was wrong. The tradeoff is
# unmap/remap churn: if this introduces stutter, step to 64 rather than
# reverting to 100.
#
# Measure it properly (fragwatch.py, added 2026-08-16 for exactly this):
#   python "Tools/IMG Tool/fragwatch.py" --wait --label texmem32
#   python "Tools/IMG Tool/fragwatch.py" --compare _runs\frag_<prev>.csv _runs\frag_texmem32_*.csv
# Decide on MIN largest-free-run. Drive the SAME route both times. Expect
# committed to be roughly UNCHANGED if the key is working as designed -- that is
# the signature of success here, not a drop in memory use.
# 2026-08-31: 32 -> 64. Texture pop-in reported. 32 is the aggressive end of
# this key and the note above already called this shot - the predicted failure
# mode of too-small a mapped window is unmap/remap churn, which is what texture
# pop-in looks like from the driver's seat. 64 halves the churn and is still
# well under the DXVK default of 100, so the address-space win that motivated 32
# is mostly kept. If pop-in persists this key is NOT the cause - go to
# ExtraStreamingMemory next, and do NOT raise dxgi.maxDeviceMemory (tried
# 2026-08-29, hit the 32-bit wall in minutes).
d3d9.textureMemory = 128   # 2026-09-06: server-side (64-bit) now; 64 was a 32-bit VA saving

# Inert on every DXVK that has shipped here (not in d3d9_options.cpp).
# Commented 2026-08-19 with the Host64 Phase 1 DLL swap (WP-13).
# d3d9.depthBiasScale = 1.5
# d3d9.slopeScaledDepthBias = 1.5
d3d9.samplerAnisotropy = 16

# HOST64 REVERTED 2026-08-24 (WP-27). Both keys below are custom -- stock DXVK
# v3.0.2 does not parse either, so they would only log as unknown options.
#
# Phase 2 was measured and it bought NOTHING. Importing an OPAQUE_WIN32
# HOST_VISIBLE handle costs the 32-bit process 100% of the chunk size as
# committed MEM_MAPPED -- exactly what the local allocation it replaced cost as
# MEM_PRIVATE. A type flip, not a hole, and ~107 MB net WORSE on committed.
# Proof: C:\dev\dxvk\notes\wp29-va-cost.md  Measurement: notes\wp26-phase2.md
#
# Live d3d9.dll is back to d3d9.dll.stock302 (44A2E749...) and dxvk64.exe is
# deleted. The p2w6 build + helper + this conf are kept in
# _backups\_host64_revert_20260824\ if any of it is ever wanted again.
#
# d3d9.hostFileChunkMB = 16   # Phase 1 v1 MemoryFile whole-chunk MapViewOfFile MiB
# d3d9.host64 = True          # Phase 2: spawn dxvk64.exe next to this DLL

# Defer surface creation to prevent blocking allocation stalls during init/resizing
d3d9.deferSurfaceCreation = True
# Disable redundant CPU-side memory allocation tracking overhead on buffer ops
d3d9.memoryTrackTest = False

# Cache write-only dynamic vertex/index buffers to eliminate CPU submission stalls
d3d9.cachedWriteOnlyBuffers = True
# Enable host memory defragmentation for 32-bit address space defense
dxvk.enableMemoryDefrag = True

# 2026-08-15: the two keys that used to sit here, plus dxvk.gplAsyncCache
# above, are NOT options in this DXVK build and never did anything. Verified
# by enumerating every "d3d9.*/dxvk.*/dxgi.*" string in d3d9.dll (85 keys);
# none of the three appear. DXVK ignores unknown keys silently, so they read
# as tuning while being inert. Do not re-add them under these names.
#   d3d9.noExplicitFrontBuffer            -> real key is d3d9.extraFrontbuffer
#   d3d9.lenientClearWithNoColorAttachments -> real key is d3d9.lenientClear
#   dxvk.gplAsyncCache                    -> no equivalent; GPL is the whole fix
# Both real spellings relax rendering behaviour, so neither is enabled here
# without a measured A/B -- see the candidate list at the bottom of this file.

# On-screen diagnostics, off. Enabled 2026-08-28 for the AA pass, off again the same
# night: the question it was meant to answer (is there GPU headroom for DLDSR
# downsampling?) was answered NO by ReflectionMSAAQuality=4 being too heavy in game.
# DSR/DLDSR is abandoned on this stack. Re-enable while measuring anything else:

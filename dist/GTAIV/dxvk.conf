# ---------------------------------------------------------------------------
# Measured-A/B candidates, all confirmed to exist in this build's key list.
# None are enabled: this stack has no baseline yet (the 2026-08-15 22:49
# benchmark aborted in init on a missing audio device). Enable ONE at a time
# and run Tools/benchmark.ps1 before and after.
#
#   d3d9.cachedWriteOnlyBuffers   CPU-side win if the game read-modify-writes
#                                 its dynamic vertex buffers; a loss if it
#                                 writes them straight through (WC is faster
#                                 for that). GTA IV is CPU-bound, so this is
#                                 the highest-value unknown.
#   dxvk.enableDescriptorBuffer   cuts descriptor-update CPU cost on Turing;
#                                 leave Auto unless the log says unsupported.
#   (d3d9.textureMemory is set to 32 above as of 2026-08-16. NOTE: this line
#    previously read "measured and APPLIED above" while the key was in fact set
#    nowhere in this file and absent from GTAIV_d3d9.log - it sat at DXVK's
#    default the whole time, and contradicted the block near the top saying it
#    had been reverted. If a comment here claims a key is applied, confirm it
#    against the effective configuration echoed in GTAIV_d3d9.log; DXVK does not
#    echo keys it never received, so absence there means default.)
#   d3d9.deviceLocalConstantBuffers  moves constant-buffer storage to VRAM and
#                                 out of the 32-bit address space. Real reclaim,
#                                 but CPU writes then cross PCIe, so it needs
#                                 its own single-variable run.
#   d3d9.maxAvailableMemory       what GetAvailableTextureMem reports to the
#                                 game. Interacts with -availablevidmem (a
#                                 multiplier) and stream.ini. Change alone.
# ---------------------------------------------------------------------------


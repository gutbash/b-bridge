# dxvk.conf for b-bridge. Read by the 64-bit bridge server's DXVK (.trex\d3d9vk_x64.dll),
# not by the game. Full option reference: https://github.com/doitsujin/dxvk/blob/master/dxvk.conf

# Exclusive fullscreen loses the D3D9 device across the process boundary. Run borderless.
dxvk.allowFse = false

# Graphics pipeline libraries are the shader-stutter fix on DXVK 3.x.
dxvk.enableGraphicsPipelineLibrary = Auto
dxvk.numCompilerThreads = 3

# Pacing belongs to the bridge client (clientFrameCap in .trex\bridge.conf). Do not add
# dxvk.maxFrameRate or dxvk.latencySleep here; a second limiter fights the client's.
# Two frames of latency lets the server overlap the game's next frame with the current one.
d3d9.maxFrameLatency = 2
d3d9.presentInterval = 0

# GTA IV sizes its texture streaming from the VRAM the driver reports. DXVK's built-in
# GTAIV.exe profile reports 128 MB; under the bridge the pool lives in the 64-bit server, so
# raising it costs the game no address space. Raise further if you see distant texture pop-in.
dxgi.maxDeviceMemory = 4096
d3d9.textureMemory = 128

d3d9.samplerAnisotropy = 16
d3d9.samplerLodBias = -0.5
d3d9.deferSurfaceCreation = True
d3d9.memoryTrackTest = False
d3d9.cachedWriteOnlyBuffers = True
dxvk.enableMemoryDefrag = True

# GTA IV copies the adapter's mode list into a fixed-size array. A driver that advertises
# over a hundred modes (4K panels, every refresh-rate variant) overruns it: the video setup
# falls back to 800x600 and the process dies a few seconds later. This lists only the desktop
# mode, its 60 Hz variant and six standard fallbacks (640x480 to 1920x1080).
# Do not add d3d9.forceAspectRatio: it removes the desktop mode itself when the display is
# not 16:9 (a 1920x1200 panel was left with only 1280x720 and 1920x1080, b-bridge issue #3).
d3d9.modeCountCompatibility = True

d3d9.countLosableResources = False
d3d9.deviceLossOnFocusLoss = True

# 2026-09-01: display swapped to an Optoma 1080p projector. The driver now
# advertises 119 modes (it exposes 3840x2160 and 4096x2160 plus 23/24/25/29/30/
# 50/59/60/119/120 Hz variants of most resolutions). GTA IV copies the
# EnumAdapterModes list into a fixed-size array; overrun it and the video setup
# falls back to its hardcoded 800x600 AND corrupts memory, which is why the
# process died ~6 s later at 0x57028b24 in no loaded module.
# Symptom was: borderless window far smaller than 1080p, then a crash.
# forceAspectRatio cuts the list to 16:9 (~36 modes); modeCountCompatibility
# clamps the reported count for exactly this class of game.
# Revert: dxvk.conf.bak_modelist_20260901
d3d9.forceAspectRatio = 16:9
d3d9.modeCountCompatibility = True

# 2026-09-05 raster bridge (Tools\install_rasterbridge.ps1): the bridge server's DXVK reads this file.
d3d9.countLosableResources = False
d3d9.deviceLossOnFocusLoss = True
d3d9.samplerLodBias = -0.5   # 2026-09-06: sharper distant textures, AF 16 already forced
